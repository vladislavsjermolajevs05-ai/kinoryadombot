<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кинорядом 🎬</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #141414;
    color: #fff;
  }
  header {
    text-align: center;
    padding: 16px;
    font-size: 24px;
    font-weight: bold;
    background: #1a1a1a;
  }
  #searchBar {
    display: flex;
    justify-content: center;
    margin: 12px;
  }
  #searchBar input {
    width: 60%;
    padding: 8px 12px;
    border-radius: 20px;
    border: none;
    font-size: 14px;
  }
  #searchBar button {
    margin-left: 8px;
    padding: 8px 12px;
    border-radius: 20px;
    border: none;
    background: #e50914;
    color: #fff;
    cursor: pointer;
  }
  .carousel {
    display: flex;
    overflow-x: auto;
    padding: 12px;
    gap: 10px;
  }
  .carousel::-webkit-scrollbar {
    display: none;
  }
  .card {
    min-width: 120px;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    transition: transform 0.3s;
    flex-shrink: 0;
  }
  .card:hover {
    transform: scale(1.1);
    z-index: 10;
  }
  .card img {
    width: 100%;
    display: block;
    border-radius: 10px;
  }
  .card .overlay {
    position: absolute;
    bottom: 0;
    width: 100%;
    background: linear-gradient(transparent, rgba(0,0,0,0.8));
    padding: 4px;
    display: flex;
    justify-content: space-around;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .card:hover .overlay {
    opacity: 1;
  }
  .card .overlay button {
    background: rgba(255,255,255,0.2);
    border: none;
    color: #fff;
    padding: 4px 6px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #profile {
    padding: 12px;
    margin: 12px;
    background: #1a1a1a;
    border-radius: 12px;
  }
  #profile h2 {
    margin: 0 0 8px 0;
    font-size: 16px;
  }
  #profile ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  #profile li {
    font-size: 12px;
    margin-bottom: 4px;
  }
</style>
</head>
<body>

<header>Кинорядом 🎬</header>

<div id="searchBar">
  <input type="text" id="searchInput" placeholder="Искать фильм...">
  <button onclick="searchMovie()">🔍</button>
</div>

<div class="carousel" id="movieCarousel"></div>

<div id="profile">
  <h2>Избранное ❤️</h2>
  <ul id="favoritesList">
    <li>Пока ничего нет</li>
  </ul>
</div>

<script>
// Вставь сюда свой API ключ, который ты мне прислал
const API_KEY = "1ea789320e9a8e2b6a8239e9620efd28";

let favorites = [];

function fetchMovies(query = "") {
  const url = query 
    ? `https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(query)}&language=ru-RU&page=1` 
    : `https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}&language=ru-RU&page=1`;

  fetch(url)
    .then(res => res.json())
    .then(data => displayMovies(data.results))
    .catch(err => console.error(err));
}

function displayMovies(movies) {
  const carousel = document.getElementById("movieCarousel");
  carousel.innerHTML = "";
  movies.forEach(m => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <img src="https://image.tmdb.org/t/p/w300${m.poster_path}" alt="${m.title}">
      <div class="overlay">
        <button onclick="toggleFavorite('${m.title || m.name}')"><i class="fas fa-heart"></i></button>
        <button onclick="watchMovie('${m.title || m.name}')"><i class="fas fa-play"></i></button>
        <button onclick="showInfo('${m.title || m.name}')"><i class="fas fa-info"></i></button>
      </div>
    `;
    carousel.appendChild(div);
  });
}

function toggleFavorite(name) {
  if (!favorites.includes(name)) {
    favorites.push(name);
    updateFavorites();
  }
}

function updateFavorites() {
  const list = document.getElementById("favoritesList");
  list.innerHTML = "";
  if (favorites.length === 0) {
    list.innerHTML = "<li>Пока ничего нет</li>";
    return;
  }
  favorites.forEach(f => {
    const li = document.createElement("li");
    li.textContent = f;
    list.appendChild(li);
  });
}

function watchMovie(name) {
  alert("Смотреть: " + name);
}

function showInfo(name) {
  alert("Информация о фильме: " + name);
}

function searchMovie() {
  const query = document.getElementById("searchInput").value;
  fetchMovies(query);
}

// Инициализация
fetchMovies();
</script>

</body>
</html>
