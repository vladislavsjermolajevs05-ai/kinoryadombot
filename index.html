<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кинорядом 🎬</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ========== Фон и тема ========== */
body {
  margin:0;
  font-family:'Segoe UI', sans-serif;
  background:#141414 url('https://i.ibb.co/YP0H9Dw/christmas-bg.jpg') center/cover no-repeat;
  color:#fff;
  transition:background 0.3s,color 0.3s;
  overflow-x:hidden;
  position:relative;
}
body.light {
  background:#fff url('https://i.ibb.co/YP0H9Dw/christmas-bg.jpg') center/cover no-repeat;
  color:#000;
}

/* ========== Header ========== */
header {
  display:flex; justify-content:space-between; align-items:center; padding:12px 16px;
  background:#1a1a1a;
}
body.light header { background:#f0f0f0; color:#000;}
.header-left { display:flex; align-items:center; gap:12px;}
.header-left a { color:#fff; text-decoration:none; font-size:14px;}
body.light .header-left a { color:#000;}
#toggleTheme { cursor:pointer; font-size:18px;}
#mainButton { cursor:pointer; font-weight:bold; font-size:20px;}
#profileBtn { cursor:pointer;}

/* ========== Поиск ========== */
#searchBar { display:flex; justify-content:center; margin:12px; }
#searchBar input { width:60%; padding:8px 12px; border-radius:20px; border:none; font-size:14px; }
#searchBar button { margin-left:8px; padding:8px 12px; border-radius:20px; border:none; background:#e50914; color:#fff; cursor:pointer; }

/* ========== Секции и карусели ========== */
.section { margin:12px 0; position:relative; }
.section h2 { margin-left:12px; font-size:16px; }
.carousel-container { position:relative; }
.carousel { display:flex; overflow-x:auto; padding:12px; gap:8px; scroll-behavior:smooth; }
.carousel::-webkit-scrollbar { display:none; }
.scroll-btn { position:absolute; top:40%; background:rgba(0,0,0,0.5); border:none; color:#fff; font-size:20px; padding:6px; cursor:pointer; border-radius:50%; z-index:10; }
.scroll-left { left:0; }
.scroll-right { right:0; }

/* ========== Карточки фильмов ========== */
.card {
  min-width:120px;
  border-radius:8px;
  overflow:hidden;
  position:relative;
  cursor:pointer;
  transition: transform 0.3s, box-shadow 0.3s;
  flex-shrink:0;
  text-align:center;
}
.card:hover {
  transform: scale(1.2) translateY(-10px);
  box-shadow: 0 10px 25px rgba(255,215,0,0.7), 0 0 15px rgba(255,255,255,0.4);
}
.card img { width:100%; display:block; border-radius:8px; }
.overlay { position:absolute; bottom:2px; width:100%; display:flex; justify-content:space-around; opacity:1; }
.overlay button { background:rgba(255,255,255,0.2); border:none; color:#fff; padding:2px 4px; border-radius:50%; cursor:pointer; font-size:12px; }
body.light .overlay button { background:rgba(0,0,0,0.1); color:#000; }

/* ========== Профиль ========== */
#profile {
  position: fixed; top:60px; right:16px;
  width:250px; max-height:70%; overflow-y:auto;
  background:#1a1a1a; border-radius:12px; padding:12px;
  display:none; z-index:1000;
}
body.light #profile { background:#f0f0f0; color:#000;}
#profile h2 { margin:0 0 8px 0; font-size:16px; }
#profile ul { list-style:none; padding:0; margin:0; }
#profile li { font-size:12px; margin-bottom:4px; }

/* ========== Модальные окна ========== */
#trailerModal, #descriptionModal { display:none; position:fixed; z-index:1000; background:rgba(0,0,0,0.85); justify-content:center; align-items:center; }
#trailerModal { top:0; left:0; width:100%; height:100%; }
#trailerModal iframe { width:90%; height:60%; border:none; border-radius:12px; }
#descriptionModal { bottom:0; width:100%; max-height:70%; background:#1a1a1a; border-radius:16px 16px 0 0; overflow-y:auto; padding:16px; box-sizing:border-box; transition: transform 0.3s ease; }
#descriptionModal img { float:left; width:120px; border-radius:8px; margin-right:12px; }
#descriptionModal h2 { margin:0 0 8px 0; }
#descriptionModal p { font-size:14px; }
#closeModal, #closeDescription { position:absolute; background:#e50914; border:none; color:#fff; border-radius:50%; cursor:pointer; }
#closeModal { top:16px; right:16px; font-size:18px; padding:6px 10px; }
#closeDescription { top:12px; right:12px; font-size:16px; padding:4px 8px; }

/* ========== Снежинки ========== */
.snowflake {
  position: fixed;
  top: -10px;
  color: #fff;
  font-size: 10px;
  z-index: 9999;
  user-select: none;
  pointer-events: none;
  animation-name: fall;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
  opacity: 0.8;
}
@keyframes fall {
  0% { transform: translateY(0) translateX(0); opacity:0; }
  50% { opacity:1; }
  100% { transform: translateY(100vh) translateX(50px); opacity:0; }
}

/* ========== Мерцающие огоньки ========== */
.light-dot {
  position: fixed;
  width: 4px;
  height: 4px;
  background: #FFD700;
  border-radius: 50%;
  z-index: 9998;
  animation-name: blink;
  animation-iteration-count: infinite;
  pointer-events:none;
}
@keyframes blink {
  0%,100% { opacity: 0.2; transform: scale(1);}
  50% { opacity:1; transform: scale(1.5);}
}

/* ========== Гирлянда сверху ========== */
.garland {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 40px;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 10000;
  pointer-events: none;
}
.garland-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: red;
  animation: garlandBlink 1.5s infinite;
}
.garland-dot:nth-child(2n){ background: yellow; animation-duration:1.2s; }
.garland-dot:nth-child(3n){ background: green; animation-duration:1.7s; }
.garland-dot:nth-child(4n){ background: blue; animation-duration:1.3s; }
@keyframes garlandBlink {
  0%,100% { opacity:0.2; transform: scale(1);}
  50% { opacity:1; transform: scale(1.5);}
}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <span id="toggleTheme">🌓</span>
    <a href="https://t.me/kinoryadomru" target="_blank">@kinoryadomru</a>
  </div>
  <div id="mainButton">Кинорядом</div>
  <div id="profileBtn">Профиль</div>
</header>

<div id="searchBar">
  <input type="text" id="searchInput" placeholder="Искать фильм или сериал...">
  <button id="searchBtn">🔍</button>
</div>

<div class="section">
<h2>Рекомендованные фильмы</h2>
<div class="carousel-container">
<button class="scroll-btn scroll-left" onclick="scrollCarousel('recommendedCarousel',-300)">◀</button>
<button class="scroll-btn scroll-right" onclick="scrollCarousel('recommendedCarousel',300)">▶</button>
<div class="carousel" id="recommendedCarousel"></div>
</div>
</div>

<div class="section">
<h2>Мультфильмы</h2>
<div class="carousel-container">
<button class="scroll-btn scroll-left" onclick="scrollCarousel('cartoonsCarousel',-300)">◀</button>
<button class="scroll-btn scroll-right" onclick="scrollCarousel('cartoonsCarousel',300)">▶</button>
<div class="carousel" id="cartoonsCarousel"></div>
</div>
</div>

<div class="section">
<h2>Сериалы</h2>
<div class="carousel-container">
<button class="scroll-btn scroll-left" onclick="scrollCarousel('seriesCarousel',-300)">◀</button>
<button class="scroll-btn scroll-right" onclick="scrollCarousel('seriesCarousel',300)">▶</button>
<div class="carousel" id="seriesCarousel"></div>
</div>
</div>

<div class="section">
<h2>Аниме</h2>
<div class="carousel-container">
<button class="scroll-btn scroll-left" onclick="scrollCarousel('animeCarousel',-300)">◀</button>
<button class="scroll-btn scroll-right" onclick="scrollCarousel('animeCarousel',300)">▶</button>
<div class="carousel" id="animeCarousel"></div>
</div>
</div>

<div id="profile">
<h2>Профиль 🎯</h2>
<h3>Избранное ❤️</h3>
<ul id="favoritesList"><li>Пока ничего нет</li></ul>
<h3>История просмотров ⏱</h3>
<ul id="historyList"><li>История просмотров пока пуста</li></ul>
</div>

<div id="trailerModal"><button id="closeModal">❌</button>
<iframe id="trailerFrame" src="" allowfullscreen></iframe></div>

<div id="descriptionModal">
<button id="closeDescription">❌</button>
<img id="descPoster" src="" alt="">
<div>
<h2 id="descTitle"></h2>
<p id="descOverview"></p>
<button id="watchTrailerBtn">▶ Смотреть трейлер</button>
<button id="addFavoriteBtn">❤️ В избранное</button>
</div>
</div>

<script>
const API_KEY="1ea789320e9a8e2b6a8239e9620efd28";
let allMovies=[], currentDescription=null;
let favorites = JSON.parse(localStorage.getItem("favorites")||"[]");
let history = JSON.parse(localStorage.getItem("history")||"[]");

// Тема
document.getElementById("toggleTheme").onclick=()=>document.body.classList.toggle("light");

// Профиль
const profileEl = document.getElementById("profile");
document.getElementById("profileBtn").onclick = () => {
  if(profileEl.style.display === "block"){
    profileEl.style.display = "none";
  } else {
    updateFavorites();
    updateHistory();
    profileEl.style.display = "block";
  }
}

// Главная
document.getElementById("mainButton").onclick=()=>window.scrollTo({top:0, behavior:'smooth'});

// Горизонтальный скролл
function scrollCarousel(id,amount){
  document.getElementById(id).scrollBy({left:amount, behavior:"smooth"});
}

// Секции
const sections = [
  {url:`https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}&language=ru-RU&page=1`, container:"recommendedCarousel", type:"movie"},
  {url:`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=16&language=ru-RU&page=1`, container:"cartoonsCarousel", type:"movie"},
  {url:`https://api.themoviedb.org/3/tv/popular?api_key=${API_KEY}&language=ru-RU&page=1`, container:"seriesCarousel", type:"tv"},
  {url:`https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_genres=16&language=ru-RU&page=1`, container:"animeCarousel", type:"tv"}
];

async function loadAllSections(){
  await Promise.all(sections.map(async s=>{
    const data = await fetch(s.url).then(r=>r.json());
    data.results.forEach(m=>{ m.type=s.type; allMovies.push(m); });
    displayMovies(data.results,s.container,s.type);
  }));
}
loadAllSections();

// Карточки
function displayMovies(movies,containerId,type="movie"){
  const container=document.getElementById(containerId);
  container.innerHTML="";
  movies.forEach(m=>{
    const id=m.id;
    const title=m.title||m.name;
    const overview=m.overview||"Описание отсутствует";
    const poster=m.poster_path?`https://image.tmdb.org/t/p/w200${m.poster_path}`:"";
    const div=document.createElement("div");
    div.className="card";
    div.innerHTML=`<img src="${poster}" alt="${title}"><div class="overlay">
    <button onclick="toggleFavorite('${title}')"><i class="fas fa-heart"></i></button>
    <button onclick="watchTrailer('${id}','${type}')"><i class="fas fa-play"></i></button>
    <button onclick="openDescription({id:'${id}',title:'${title}',poster:'${poster}',overview:'${overview.replace(/'/g,"\\'")}',type:'${type}'})"><i class="fas fa-info"></i></button>
    </div>`;
    div.ondblclick=()=>openDescription({id,title,poster,overview,type});
    container.appendChild(div);
    addHoverTrailer(div,id,type);
  });
}

// Hover-трейлер с кликом на звук
function addHoverTrailer(card,id,type){
  const container = document.createElement("div");
  container.style.position="absolute";
  container.style.top="0";
  container.style.left="0";
  container.style.width="100%";
  container.style.height="100%";
  container.style.borderRadius="8px";
  container.style.pointerEvents="auto";

  const iframe = document.createElement("iframe");
  iframe.style.width="100%";
  iframe.style.height="100%";
  iframe.style.border="none";
  iframe.style.display="none";

  let soundOn = false;

  container.appendChild(iframe);
  card.appendChild(container);

  card.onmouseenter = async ()=>{
    const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}/videos?api_key=${API_KEY}&language=ru-RU`);
    const data = await res.json();
    const trailer = data.results.find(v=>v.type==="Trailer" && v.site==="YouTube");
    if(trailer){
      iframe.src = `https://www.youtube.com/embed/${trailer.key}?autoplay=1&mute=1&loop=1&controls=0&playlist=${trailer.key}`;
      iframe.style.display = "block";
      soundOn = false;
    }
  }

  card.onmouseleave = ()=>{
    iframe.style.display="none";
    iframe.src="";
  }

  container.onclick = ()=>{
    if(!iframe.src) return;
    const key = iframe.src.match(/embed\/(.*?)\?/)[1];
    if(!soundOn){
      iframe.src = `https://www.youtube.com/embed/${key}?autoplay=1&mute=0&loop=1&controls=0&playlist=${key}`;
      soundOn = true;
    } else {
      iframe.src = `https://www.youtube.com/embed/${key}?autoplay=1&mute=1&loop=1&controls=0&playlist=${key}`;
      soundOn = false;
    }
  }
}

// Избранное и история
function toggleFavorite(title){
  if(!favorites.includes(title)) favorites.push(title);
  else favorites = favorites.filter(f=>f!==title);
  localStorage.setItem("favorites",JSON.stringify(favorites));
  updateFavorites();
}
function addHistory(title){
  if(!history.includes(title)) history.unshift(title);
  if(history.length>20) history.pop();
  localStorage.setItem("history",JSON.stringify(history));
  updateHistory();
}
function updateFavorites(){
  const list=document.getElementById("favoritesList");
  list.innerHTML = "";
  if(favorites.length===0){ list.innerHTML="<li>Пока ничего нет</li>"; return;}
  favorites.forEach(f=>{ const li=document.createElement("li"); li.textContent=f; list.appendChild(li); });
}
function updateHistory(){
  const list=document.getElementById("historyList");
  list.innerHTML = "";
  if(history.length===0){ list.innerHTML="<li>История просмотров пока пуста</li>"; return;}
  history.forEach(f=>{ const li=document.createElement("li"); li.textContent=f; list.appendChild(li); });
}

// Модальный трейлер
function watchTrailer(id,type){
  fetch(`https://api.themoviedb.org/3/${type}/${id}/videos?api_key=${API_KEY}&language=ru-RU`)
    .then(res=>res.json())
