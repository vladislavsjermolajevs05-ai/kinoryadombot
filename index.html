<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кинорядом</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;}
body{margin:0;background:#0f1720;color:#fff;transition:background 0.3s,color 0.3s;}
body.light{background:#f1f1f1;color:#111;}
header{padding:16px;font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px;background:#111827;position:sticky;top:0;z-index:100;transition:background 0.3s;}
header.light{background:#fff;color:#111;}
.search{margin:12px;padding:14px;border-radius:16px;background:rgba(28,36,48,0.8);border:none;color:#fff;width:calc(100% - 24px);font-size:16px;transition:background 0.3s,color 0.3s;}
.search.light{background:#e2e2e2;color:#111;}
.carousel{display:flex;overflow-x:auto;gap:12px;padding:12px;scroll-behavior:smooth;}
.card{min-width:140px;border-radius:16px;background:rgba(255,255,255,0.05);backdrop-filter: blur(15px);padding:8px;flex-shrink:0;transition: transform 0.2s, background 0.3s;cursor:pointer;}
.card:hover{transform: scale(1.05);}
.card.light{background:rgba(255,255,255,0.3);}
.card img{width:100%;border-radius:12px;}
.card h3{margin:8px 0 4px;font-size:14px;}
.card span{color:#9aa4b2;font-size:12px;}
.card.light span{color:#444;}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#111827;border-top:1px solid #1f2937;transition:background 0.3s;}
nav.light{background:#fff;border-top:1px solid #ccc;}
nav button{flex:1;padding:12px;background:none;border:none;color:#9aa4b2;font-size:14px;transition: color 0.2s;}
nav button.active{color:#3b82f6;}
nav.light button{color:#555;}
nav.light button.active{color:#3b82f6;}
.profile{text-align:center;padding:30px;}
.avatar{width:90px;height:90px;border-radius:50%;background:#3b82f6;margin:0 auto 12px;}
#movie-card{padding:12px;display:none;}
#movie-card img{width:100%;border-radius:12px;margin-bottom:12px;}
button.trailer{width:100%;padding:14px;border:none;border-radius:16px;background:#3b82f6;color:#fff;font-size:16px;margin-top:12px;cursor:pointer;}
button.back{margin-top:12px;width:100%;padding:12px;border:none;border-radius:14px;background:#9aa4b2;color:#111;font-size:16px;}
.list-item{background:rgba(255,255,255,0.05);margin:8px 0;padding:12px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;}
.list-item span{font-size:14px;color:#fff;}
.list-item button{background:#3b82f6;border:none;border-radius:10px;padding:6px 12px;color:#fff;cursor:pointer;}
.list-item.light span{color:#111;}
</style>
</head>

<body>

<header>🎬 Кинорядом
  <button onclick="toggleTheme()" style="margin-left:auto;padding:6px 12px;border-radius:12px;border:none;background:#3b82f6;color:#fff;cursor:pointer;font-size:14px;">🌗 Тема</button>
</header>

<input class="search" placeholder="Поиск фильмов и сериалов..." oninput="searchMovies(this.value)">

<div id="trending" class="carousel"></div>
<div id="content"></div>
<div id="movie-card"></div>

<div id="profile" style="display:none" class="profile">
  <div class="avatar"></div>
  <h2 id="username">Профиль</h2>
  <p>🎟️ Подписка: Бесплатная</p>
  <button onclick="alert('Получить Stars!')" style="padding:12px 20px;border-radius:14px;border:none;background:#3b82f6;color:#fff;margin-bottom:12px;">💫 Telegram Stars</button>
  <h3>❤️ Избранное</h3>
  <div id="favorites"></div>
  <h3>🕓 История</h3>
  <div id="history"></div>
  <button onclick="clearHistory()" style="padding:12px 20px;border-radius:14px;border:none;background:#3b82f6;color:#fff;margin-top:12px">Очистить историю</button>
</div>

<nav>
  <button class="active" onclick="showHome(this)">🏠</button>
  <button onclick="showProfile(this)">👤</button>
</nav>

<script>
const API_KEY = "1ea789320e9a8e2b6a8239e9620efd28";
const content = document.getElementById("content");
const trendingEl = document.getElementById("trending");
const movieCard = document.getElementById("movie-card");
const usernameEl = document.getElementById("username");
const favoritesEl = document.getElementById("favorites");
const historyEl = document.getElementById("history");

Telegram.WebApp.ready();
usernameEl.innerText = Telegram.WebApp.initDataUnsafe?.user?.first_name || "Профиль";

let favorites = JSON.parse(localStorage.getItem("favorites")) || [];
let history = JSON.parse(localStorage.getItem("history")) || [];

function saveFavorites(){localStorage.setItem("favorites", JSON.stringify(favorites))}
function saveHistory(){localStorage.setItem("history", JSON.stringify(history))}

// Тема
function toggleTheme(){
  document.body.classList.toggle("light");
  document.querySelectorAll(".card").forEach(c=>c.classList.toggle("light"));
  document.querySelector("header").classList.toggle("light");
  document.querySelector("input.search").classList.toggle("light");
  document.querySelector("nav").classList.toggle("light");
  document.querySelectorAll(".list-item").forEach(i=>i.classList.toggle("light"));
}

// Загрузка трендов
async function loadTrending(){
  const res = await fetch(`https://api.themoviedb.org/3/trending/movie/day?api_key=${API_KEY}&language=ru`);
  const data = await res.json();
  trendingEl.innerHTML="";
  data.results.forEach(m=>{
    if(!m.poster_path) return;
    const div = document.createElement("div");
    div.className="card";
    div.innerHTML=`<img src="https://image.tmdb.org/t/p/w300${m.poster_path}">
                   <h3>${m.title || m.name}</h3>
                   <span>⭐ ${m.vote_average}</span>`;
    div.onclick = ()=>showMovie(m.id, m.title || m.name);
    trendingEl.appendChild(div);
  });
}

// Поиск
async function searchMovies(q){
  if(!q){content.innerHTML=""; return;}
  const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&language=ru&query=${q}`);
  const data = await res.json();
  content.innerHTML="";
  data.results.forEach(m=>{
    if(!m.poster_path) return;
    const div = document.createElement("div");
    div.className="card";
    div.innerHTML=`<img src="https://image.tmdb.org/t/p/w300${m.poster_path}">
                   <h3>${m.title || m.name}</h3>
                   <span>⭐ ${m.vote_average}</span>`;
    div.onclick = ()=>showMovie(m.id, m.title || m.name);
    content.appendChild(div);
  });
}

// Показ фильма
async function showMovie(id, title){
  const res = await fetch(`https://api.themoviedb.org/3/movie/${id}?api_key=${API_KEY}&language=ru`);
  const m = await res.json();
  trendingEl.style.display="none";
  content.style.display="none";
  movieCard.style.display="block";

  if(!history.find(f=>f.id===m.id)){history.unshift({id:m.id,title:m.title}); if(history.length>20) history.pop(); saveHistory();}
  renderProfileLists();

  const isFav = favorites.find(f=>f.id===m.id);
  movieCard.innerHTML=`
    <img src="https://image.tmdb.org/t/p/w500${m.poster_path}">
    <h2>${m.title}</h2>
    <p>⭐ ${m.vote_average} | ${m.release_date?.split('-')[0]} | ${m.genres.map(g=>g.name).join(', ')}</p>
    <p>${m.overview}</p>
    <video controls width="100%" style="border-radius:12px;margin-top:12px;">
      <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
      Ваш браузер не поддерживает видео.
    </video>
    <button class="trailer" onclick="toggleFavorite(${id},'${m.title}')">${isFav?'💔 Убрать из избранного':'❤️ В избранное'}</button>
    <button class="back" onclick="backToHome()">⬅ Назад</button>
  `;
}

// Избранное
function toggleFavorite(id,title){
  const idx = favorites.findIndex(f=>f.id===id);
  if(idx>=0){favorites.splice(idx,1)}
  else{favorites.push({id,title})}
  saveFavorites();
  renderProfileLists();
  showMovie(id,title);
}

// Профиль списки
function renderProfileLists(){
  favoritesEl.innerHTML="";
  favorites.forEach(f=>{
    const div=document.createElement("div");
    div.className="list-item";
    div.innerHTML=`<span>${f.title}</span><button onclick="toggleFavorite(${f.id},'${f.title}')">💔</button>`;
    favoritesEl.appendChild(div);
  });

  historyEl.innerHTML="";
  history.forEach(f=>{
    const div=document.createElement("div");
    div.className="list-item";
    div.innerHTML=`<span>${f.title}</span><button onclick="showMovie(${f.id},'${f.title}')">▶</button>`;
    historyEl.appendChild(div);
  });
}

// Очистка истории
function clearHistory(){
  history=[];
  saveHistory();
  renderProfileLists();
}

// Назад
function backToHome(){
  movieCard.style.display="none";
  trendingEl.style.display="flex";
  content.style.display="block";
}

// Навигация
function showHome(btn){
  setActive(btn);
  trendingEl.style.display="flex";
  content.style.display="block";
  movieCard.style.display="none";
  document.getElementById("profile").style.display="none";
}
function showProfile(btn){
  setActive(btn);
  trendingEl.style.display="none";
  content.style.display="none";
  movieCard.style.display="none";
  document.getElementById("profile").style.display="block";
  renderProfileLists();
}
function setActive(btn){
  document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
}

loadTrending();
renderProfileLists();
</script>

</body>
</html>
