<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кинорядом 🎬</title>
<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: #fff;
    margin: 0;
    padding: 0;
  }
  header {
    text-align: center;
    padding: 16px;
    font-size: 24px;
    font-weight: bold;
  }
  #searchBar {
    display: flex;
    justify-content: center;
    margin: 8px;
  }
  #searchBar input {
    width: 60%;
    padding: 6px 12px;
    border-radius: 12px;
    border: none;
    font-size: 14px;
  }
  #searchBar button {
    margin-left: 8px;
    padding: 6px 12px;
    border-radius: 12px;
    border: none;
    background: #3b82f6;
    color: #fff;
    cursor: pointer;
  }
  .carousel {
    display: flex;
    overflow-x: auto;
    padding: 12px;
    gap: 10px;
  }
  .card {
    min-width: 100px;
    border-radius: 12px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    padding: 6px;
    flex-shrink: 0;
    cursor: pointer;
    text-align: center;
  }
  .card img {
    width: 100%;
    border-radius: 10px;
  }
  .card h3 {
    margin: 6px 0 2px;
    font-size: 12px;
  }
  .card span {
    font-size: 10px;
  }
  .card button {
    flex: 1;
    margin-top: 4px;
    padding: 4px;
    font-size: 10px;
    border: none;
    border-radius: 6px;
    background: #3b82f6;
    color: #fff;
    cursor: pointer;
  }
  #profile {
    padding: 12px;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    margin: 12px;
  }
  #profile h2 {
    margin: 0 0 8px 0;
    font-size: 16px;
  }
  #profile ul {
    list-style: none;
    padding: 0;
  }
  #profile li {
    font-size: 12px;
    margin-bottom: 4px;
  }
</style>
</head>
<body>

<header>Кинорядом 🎬</header>

<div id="searchBar">
  <input type="text" id="searchInput" placeholder="Искать фильм...">
  <button onclick="searchMovie()">🔍</button>
</div>

<div class="carousel" id="movieCarousel"></div>

<div id="profile">
  <h2>Профиль</h2>
  <ul id="favoritesList">
    <li>Избранное пока пусто ❤️</li>
  </ul>
</div>

<script>
const API_KEY = "ТВОЙ_API_KEY"; // можно заменить на KinoZorg или другой API
let favorites = [];

function fetchMovies(query = "") {
  // Здесь пример запроса к TMDB API
  const url = query 
    ? `https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${query}` 
    : `https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}&language=ru-RU&page=1`;

  fetch(url)
    .then(res => res.json())
    .then(data => displayMovies(data.results))
    .catch(err => console.error(err));
}

function displayMovies(movies) {
  const carousel = document.getElementById("movieCarousel");
  carousel.innerHTML = "";
  movies.forEach(m => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <img src="https://image.tmdb.org/t/p/w300${m.poster_path}" alt="${m.title}">
      <h3>${m.title || m.name}</h3>
      <span>⭐ ${m.vote_average}</span>
      <div style="display:flex;gap:4px;">
        <button onclick="toggleFavorite('${m.title || m.name}')">❤️</button>
        <button onclick="watchMovie('${m.title || m.name}')">▶</button>
        <button onclick="showInfo('${m.title || m.name}')">ℹ</button>
      </div>
    `;
    carousel.appendChild(div);
  });
}

function toggleFavorite(name) {
  if (!favorites.includes(name)) {
    favorites.push(name);
    updateFavorites();
  }
}

function updateFavorites() {
  const list = document.getElementById("favoritesList");
  list.innerHTML = "";
  if (favorites.length === 0) {
    list.innerHTML = "<li>Избранное пока пусто ❤️</li>";
    return;
  }
  favorites.forEach(f => {
    const li = document.createElement("li");
    li.textContent = f;
    list.appendChild(li);
  });
}

function watchMovie(name) {
  alert("Смотреть: " + name);
}

function showInfo(name) {
  alert("Информация о фильме: " + name);
}

function searchMovie() {
  const query = document.getElementById("searchInput").value;
  fetchMovies(query);
}

// Инициализация
fetchMovies();
</script>

</body>
</html>
